<!doctype html><html><head><meta charset="utf-8">
<link href="fonts_poppins.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1005px;overflow:hidden;background:#070202 url(bg_arcs_1920b.jpg) 0 0/1920px 1005px no-repeat;font-family:'Poppins',sans-serif;color:#fff;text-transform:uppercase}
.halo{position:absolute;inset:0;background:radial-gradient(ellipse 30% 80% at 27% 45%,rgba(3,1,1,.95) 35%,rgba(3,1,1,0) 100%)}
.photo{position:absolute;left:-70px;top:-150px;width:1333px;height:2000px;background:url(photos/just2.jpg) 0 0/100% 100% no-repeat;
 -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0) 8%,#000 13%,#000 48%,rgba(0,0,0,0) 58%),radial-gradient(ellipse 30% 36% at 49% 32%,#000 62%,rgba(0,0,0,0) 100%);
 -webkit-mask-composite:source-in;mask-composite:intersect;filter:contrast(1.06)}
.shade{position:absolute;left:880px;right:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.55) 25%,rgba(0,0,0,.6))}
.c{position:absolute;left:960px;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.warm{position:absolute;top:120px;left:1440px;transform:translateX(-50%);width:170px}
.stack{top:250px}
.j2{height:92px}
.label{font-weight:500;font-size:16px;letter-spacing:.38em;padding-left:.38em;margin-top:12px}
.lineup{font-weight:700;font-size:52px;letter-spacing:-.01em;margin-top:18px;line-height:1.1}
.lineup em{font-style:normal;font-weight:300;opacity:.55;margin:0 18px}
.venue{margin-top:32px;line-height:1}
.venue b{display:block;font-weight:600;font-size:26px;letter-spacing:.2em;padding-left:.2em}
.venue i{display:block;font-style:normal;font-weight:400;font-size:20px;text-transform:none;margin-top:2px}
.date{font-weight:700;font-size:50px;letter-spacing:-.01em;line-height:1;margin-top:18px}
.date span{font-weight:300}
.l1{font-weight:600;font-size:20px;letter-spacing:.06em;margin-top:18px}
.l2{font-weight:500;font-size:15px;letter-spacing:.07em;margin-top:12px;opacity:.9}
.l1 em,.l2 em{font-style:normal;opacity:.55;margin:0 12px}
</style></head><body>
<div class="halo"></div><div class="photo"></div><div class="shade"></div>
<img class="warm" src="logos/warm_white.png">
<div class="c stack">
 <img class="j2" src="logos/just2_white.png">
 <div class="label">Solid Grooves</div>
 <div class="lineup">Salvi Fernandez<br>Dani Corral<br>Lady Sasha</div>
 <div class="venue"><b>BRIBÓN</b><i>del puerto</i></div>
 <div class="date"><span>SÁB</span> 24 OCTUBRE</div>
 <div class="l1">23:00H <em>—</em> 07:00H</div>
 <div class="l2">Península de Contradique, 04720 <em>·</em> Aguadulce (Almería)</div><div class="l2">Info &amp; Reservas <em>·</em> 679 743 114</div>
</div>
</body></html>
