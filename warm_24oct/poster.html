<!doctype html><html><head><meta charset="utf-8">
<link href="fonts.css" rel="stylesheet">
<style>
:root{--cream:#F2E8DA;--ember:#FF5A1F}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#000;overflow:hidden}
.p{position:relative;width:1080px;height:1350px;background:url(bg_heat.png) center/cover;color:var(--cream);font-family:'Archivo';}
.mono{font-family:'Space Mono';font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.top{position:absolute;left:64px;right:64px;top:58px;display:flex;justify-content:space-between;align-items:flex-start}
.logo{border:1px dashed rgba(242,232,218,.55);padding:14px 22px;font-family:'Archivo';font-stretch:125%;font-weight:800;font-size:34px;letter-spacing:.02em}
.logo small{display:block;font-family:'Space Mono';font-weight:400;font-size:11px;letter-spacing:.12em;opacity:.6;margin-top:4px}
.date{text-align:right;line-height:1.45}
.hero{position:absolute;left:58px;top:330px}
.hero .n{font-stretch:62%;font-weight:800;font-size:132px;line-height:.86;letter-spacing:-.01em;text-transform:uppercase}
.hero .n i{font-style:normal;font-family:'Space Mono';font-size:15px;vertical-align:top;margin-left:10px;letter-spacing:.1em;color:var(--ember);position:relative;top:14px}
.side{position:absolute;right:54px;top:420px;writing-mode:vertical-rl;opacity:.7}
.time{position:absolute;left:64px;right:64px;bottom:190px;display:flex;align-items:baseline;gap:22px;border-top:1px solid rgba(242,232,218,.45);padding-top:22px}
.time b{font-stretch:125%;font-weight:300;font-size:64px;letter-spacing:-.01em}
.time span{flex:1;height:1px;background:var(--cream);opacity:.5;transform:translateY(-18px)}
.bot{position:absolute;left:64px;right:64px;bottom:58px;display:flex;justify-content:space-between;align-items:flex-end;line-height:1.5}
.venue b{font-family:'Archivo';font-stretch:100%;font-weight:700;font-size:26px;letter-spacing:.01em;display:block;text-transform:none}
.logos{display:flex;gap:12px}
.logos div{border:1px dashed rgba(242,232,218,.45);width:108px;height:48px;display:grid;place-items:center;font-size:10px;opacity:.7}
</style></head><body><div class="p">
<div class="top"><div class="logo">WARM<small>LOGO OFICIAL</small></div>
<div class="date mono">Sábado<br><span style="font-size:40px;font-family:Archivo;font-stretch:125%;font-weight:800;letter-spacing:0">24.10.26</span></div></div>
<div class="hero">
<div class="n">Just2<i>01</i></div>
<div class="n">Salvi<br>Fernandez<i>02</i></div>
<div class="n">Coral<i>03</i></div>
<div class="n">Bitch<i>04</i></div>
</div>
<div class="side mono">House — Techno — 8 horas</div>
<div class="time"><b>23:00</b><span></span><b>07:00</b></div>
<div class="bot"><div class="venue mono"><b>Bribón del Puerto</b>Aguadulce · Almería</div>
<div class="logos mono"><div>logo venue</div><div>logo partner</div></div></div>
</div></body></html>
