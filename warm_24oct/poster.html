<!doctype html><html><head><meta charset="utf-8">
<link href="fonts.css" rel="stylesheet">
<style>
:root{--cream:#FFFFFF;--ember:#FF5A1F}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#000;overflow:hidden}
.p{position:relative;width:1080px;height:1350px;background:url(bg_heat.png) center/cover;color:var(--cream);font-family:'Archivo';
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:110px 120px}
/* safe zone guide (debug) */
.p::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 46% 30% at 50% 45%,rgba(0,0,0,.55),rgba(0,0,0,0) 100%);pointer-events:none}
.p>*{position:relative}
.guide{position:absolute;inset:110px 120px;border:1px dashed #0f0;display:none}
.mono{font-family:'Space Mono';font-size:17px;letter-spacing:.14em;text-transform:uppercase}
.logo{border:1px dashed rgba(242,232,218,.55);padding:12px 26px;font-stretch:125%;font-weight:800;font-size:40px;letter-spacing:.04em}
.logo small{display:block;font-family:'Space Mono';font-weight:400;font-size:10px;letter-spacing:.16em;opacity:.6;margin-top:2px}
.head{display:flex;flex-direction:column;align-items:center;gap:36px}
.mid{display:flex;flex-direction:column;align-items:center;gap:78px}
.date{font-stretch:125%;font-weight:800;font-size:30px;letter-spacing:.02em}
.date span{font-family:'Space Mono';font-weight:400;font-size:17px;letter-spacing:.14em;opacity:.8;margin:0 14px;vertical-align:4px}
.wlogo{width:250px;display:block}
.lineup{display:flex;flex-direction:column;align-items:center;gap:20px}
.lineup .j2{height:118px;display:block;margin-bottom:18px}
.lineup .n{font-stretch:62%;font-weight:800;font-size:96px;line-height:.74;text-transform:uppercase;letter-spacing:-.005em}
.lineup .sep{font-family:'Space Mono';font-size:15px;color:var(--cream);opacity:1;letter-spacing:.3em;margin:6px 0 8px}
.time{display:flex;align-items:center;gap:26px;width:760px}
.time b{font-stretch:125%;font-weight:300;font-size:54px}
.time span{flex:1;height:1px;background:var(--cream);opacity:.55}
.foot{display:flex;flex-direction:column;align-items:center;gap:10px}
.foot b{font-weight:700;font-size:28px;letter-spacing:.01em}
.logos{display:flex;gap:14px;margin-top:18px}
.logos div{border:1px dashed rgba(242,232,218,.45);width:112px;height:46px;display:grid;place-items:center;font-size:10px;opacity:.7}
</style></head><body><div class="p"><div class="guide"></div>
<div class="head"><img class="wlogo" src="logos/warm_white.png" alt="WARM">
<div class="date">SÁB<span>—</span>24.10.2026</div></div>
<div class="mid"><div class="lineup">
<img class="j2" src="logos/just2_white.png" alt="JUST2">
<div class="n">Salvi Fernandez</div>
<div class="n">Dani Corral</div>
<div class="n">Lady Sasha</div>
</div>
<div class="time"><b>23:00</b><span></span><b>07:00</b></div></div>
<div class="foot"><b>Bribón del Puerto</b><div class="mono">Aguadulce · Almería</div>
<div class="logos mono"><div>logo venue</div><div>logo partner</div></div></div>
</div></body></html>
