<!doctype html><html><head><meta charset="utf-8">
<link href="fonts_poppins.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1005px;overflow:hidden;background:#070202 url(bg_thermal_1920.png) 0 0/1920px 1005px no-repeat;font-family:'Poppins',sans-serif;color:#fff;text-transform:uppercase}
.halo{position:absolute;inset:0;background:radial-gradient(ellipse 28% 62% at 50% 34%,rgba(3,1,1,.95) 35%,rgba(3,1,1,0) 100%)}
.photo{position:absolute;left:370px;top:-142px;width:1200px;height:1800px;background:url(photos/just2.jpg) 0 0/100% 100% no-repeat;
 -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0) 8%,#000 12%,#000 36%,rgba(0,0,0,0) 44%),radial-gradient(ellipse 27% 30% at 49% 25%,#000 60%,rgba(0,0,0,0) 100%);
 -webkit-mask-composite:source-in;mask-composite:intersect;filter:contrast(1.06)}
.shade{position:absolute;left:0;right:0;top:470px;height:585px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.45) 40%,rgba(0,0,0,.55))}
.c{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.warm{position:absolute;top:66px;left:90px;width:190px;filter:drop-shadow(0 2px 14px rgba(0,0,0,.5))}
.tr{position:absolute;top:56px;right:90px;text-align:center;line-height:1;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.tr b{display:block;font-weight:600;font-size:32px;letter-spacing:.2em;padding-left:.2em}
.tr i{display:block;font-style:normal;font-weight:400;font-size:24px;text-transform:none;margin-top:4px}
.stack{top:492px}
.j2{height:92px}
.label{font-weight:500;font-size:16px;letter-spacing:.38em;padding-left:.38em;margin-top:12px}
.lineup{font-weight:700;font-size:46px;letter-spacing:-.01em;margin-top:18px;line-height:1.1}
.lineup em{font-style:normal;font-weight:300;opacity:.55;margin:0 18px}
.venue{margin-top:32px;line-height:1}
.venue b{display:block;font-weight:600;font-size:26px;letter-spacing:.2em;padding-left:.2em}
.venue i{display:block;font-style:normal;font-weight:400;font-size:20px;text-transform:none;margin-top:2px}
.date{font-weight:700;font-size:56px;letter-spacing:-.01em;line-height:1;margin-top:30px}
.date span{font-weight:300}
.l1{font-weight:600;font-size:20px;letter-spacing:.06em;margin-top:18px}
.l2{font-weight:500;font-size:15px;letter-spacing:.07em;margin-top:12px;opacity:.9}
.l1 em,.l2 em{font-style:normal;opacity:.55;margin:0 12px}
</style></head><body>
<div class="halo"></div><div class="photo"></div><div class="shade"></div>
<img class="warm" src="logos/warm_white.png">
<div class="tr"><b>BRIBÓN</b><i>del puerto</i></div>
<div class="c stack">
 <img class="j2" src="logos/just2_white.png">
 <div class="label">Solid Grooves</div>

 <div class="l1">23:00H <em>—</em> 07:00H</div>
 <div class="l2">Península de Contradique, 04720 <em>·</em> Aguadulce (Almería) <em>·</em> Info &amp; Reservas 679 743 114</div>
</div>
