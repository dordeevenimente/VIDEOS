<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{--ink:#07060b;--paper:#f3efe8;--red:#e0322f;--mute:#9a95a8}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;background:var(--ink);overflow:hidden}
  .poster{position:relative;width:1080px;height:1350px;background:var(--ink);color:var(--paper);
    font-family:"Inter Display","Inter",sans-serif}
  .mono{font-family:"JetBrains Mono",monospace;font-weight:500;letter-spacing:.08em;text-transform:uppercase}

  /* hero photo, full bleed, fades into the type block */
  .hero{position:absolute;left:0;top:0;width:1080px;height:790px;overflow:hidden}
  .hero img{position:absolute;left:0;top:-520px;width:1080px;height:auto}
  .hero::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(60% 40% at 18% 96%,rgba(224,50,47,.22),rgba(224,50,47,0) 70%)}
  .hero::after{z-index:1;content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(7,6,11,.55) 0%,rgba(7,6,11,0) 18%,rgba(7,6,11,0) 46%,rgba(7,6,11,.85) 80%,var(--ink) 100%)}

  .top{position:absolute;left:80px;right:80px;top:66px;display:flex;justify-content:space-between;
    align-items:center;font-size:21px;z-index:3}
  .top .x{color:var(--red)}
  .top .dot{width:12px;height:12px;border-radius:50%;background:var(--red)}

  .logo{position:absolute;left:50%;top:168px;width:430px;transform:translateX(-50%);
    mix-blend-mode:screen;z-index:2}

  .date{position:absolute;left:74px;right:80px;top:706px;display:flex;align-items:flex-end;gap:30px;z-index:3}
  .day{font-weight:900;font-size:336px;line-height:.74;letter-spacing:-.055em}
  .month{display:flex;flex-direction:column;padding-bottom:4px}
  .month b{font-weight:900;font-size:112px;line-height:.86;letter-spacing:-.035em}
  .month span{font-weight:300;font-size:112px;line-height:.86;letter-spacing:-.03em;color:var(--paper)}

  .rule{position:absolute;left:80px;right:80px;top:1022px;height:2px;background:var(--red)}
  .tag{position:absolute;left:80px;right:80px;top:1048px;font-weight:800;font-size:40px;white-space:nowrap;
    line-height:1.04;letter-spacing:-.018em}
  .info{position:absolute;left:80px;top:1112px;font-size:23px;color:var(--paper)}
  .info i{font-style:normal;color:var(--red);padding:0 .25em}

  .foot{position:absolute;left:80px;right:80px;top:1166px;display:flex;justify-content:space-between;
    align-items:center;border-top:1px solid rgba(243,239,232,.22);padding-top:22px}
  .foot .mono{font-size:18px;color:var(--mute)}
  .foot img{height:74px;mix-blend-mode:screen}

  .grain{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:.10;mix-blend-mode:overlay}
</style></head>
<body><div class="poster">
  <div class="hero"><img src="photo.jpg"></div>

  <div class="top mono"><span>CATCAPE <span class="x">×</span> LA FÁBRICA PREMIUM</span><span class="dot"></span></div>

  <img class="logo" src="catcape.png">

  <div class="date">
    <div class="day">19</div>
    <div class="month"><b>DICIEMBRE</b><span>2026</span></div>
  </div>

  <div class="rule"></div>
  <div class="tag">NOS VAMOS DE FIESTA EN HORARIO ESCOLAR.</div>
  <div class="info mono">MÚSICA ELECTRÓNICA<i>·</i>DESDE LAS 16:00 H</div>

  <div class="foot">
    <span class="mono">PRÓXIMAMENTE, TODA LA INFORMACIÓN.</span>
    <img src="lafabrica.png">
  </div>

  <svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div></body></html>
