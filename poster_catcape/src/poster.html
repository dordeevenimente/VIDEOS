<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root{--navy:#020028;--paper:#f4f0ea;--red:#ff3b30;--mute:#8f8db5}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;background:var(--navy);overflow:hidden}
  .poster{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--navy);color:var(--paper);
    font-family:"Inter Display","Inter",sans-serif}
  .mono{font-family:"JetBrains Mono",monospace;font-weight:500;letter-spacing:.1em;text-transform:uppercase}

  .bg{position:absolute;left:58px;top:60px;width:1000px;-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent 100%);mask-image:radial-gradient(closest-side,#000 72%,transparent 100%)}
  .shade{position:absolute;inset:0;background:
    linear-gradient(180deg,rgba(2,0,40,.0) 0%,rgba(2,0,40,0) 62%,rgba(2,0,40,.78) 80%,rgba(2,0,40,.96) 100%)}

  .top{position:absolute;left:80px;right:80px;top:70px;display:flex;justify-content:center;align-items:center;font-size:20px}
  .top .x{color:var(--red)}

  .logo{position:absolute;left:50%;transform:translateX(-50%);top:122px;width:360px;mix-blend-mode:screen}

  .date{position:absolute;left:72px;right:80px;top:712px;display:flex;align-items:flex-end;gap:28px}
  .day{font-weight:900;font-size:330px;line-height:.74;letter-spacing:-.055em}
  .month{display:flex;flex-direction:column;padding-bottom:2px}
  .month b{font-weight:900;font-size:110px;line-height:.86;letter-spacing:-.035em}
  .month span{font-weight:300;font-size:110px;line-height:.86;letter-spacing:-.03em}

  .low{position:absolute;left:80px;right:80px;top:1010px}
  .rule{height:2px;background:var(--red)}
  .tag{margin-top:24px;font-weight:800;font-size:40px;line-height:1;letter-spacing:-.018em;white-space:nowrap}
  .info{margin-top:22px;font-size:23px}
  .info i{font-style:normal;color:var(--red);padding:0 .25em}
  .foot{margin-top:30px;display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid rgba(244,240,234,.2);padding-top:20px}
  .foot .mono{font-size:18px;color:var(--mute)}
  .foot img{height:72px;mix-blend-mode:screen}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.08;mix-blend-mode:overlay}
</style></head>
<body><div class="poster">
  <img class="bg" src="twist.jpg">
  <div class="shade"></div>
  <div class="top mono"><span>CATCAPE <span class="x">×</span> LA FÁBRICA PREMIUM</span></div>
  <img class="logo" src="catcape.png">
  <div class="date"><div class="day">19</div><div class="month"><b>DICIEMBRE</b><span>2026</span></div></div>
  <div class="low">
    <div class="rule"></div>
    <div class="tag">NOS VAMOS DE FIESTA EN HORARIO ESCOLAR.</div>
    <div class="info mono">MÚSICA ELECTRÓNICA<i>·</i>DESDE LAS 16:00 H</div>
    <div class="foot"><span class="mono">PRÓXIMAMENTE, TODA LA INFORMACIÓN.</span><img src="lafabrica.png"></div>
  </div>
  <svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div></body></html>
